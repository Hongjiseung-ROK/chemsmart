# The research loop as an object. One version per commit; the parent is in git.
# `status`: inherited = taken from the owner's bootstrap or from habit, never
# tested; tested = evaluated once, result in the ledger; promoted = adopted on
# ledger evidence against the policy it replaced. A component is mutated the
# same way a product rule is: hypothesis, falsifier, candidates, ledger record.
# Edit through `generation.py promote`, so every change has a decision row.
version: g1
parent: g0
provenance: 'The loop that actually ran on 2026-09-19 (round 1, generation 0), written down as it behaved, not as it was intended. Source of the inherited parts: bootstrap/g0-owner-prompt.md.'
fundamentals:
  hub: CHEMSMART is the canonical hub; no model-authored native input, shell, status or second execution language.
  researcher: the Agent is an autonomous scientific researcher; honesty, provenance and anomalies-as-evidence are increased, never suppressed.
components:
  bootstrap:
    policy: The owner's full 3.5k-word prompt is pasted at session start; nothing shorter exists.
    impl: bootstrap/g0-owner-prompt.md
    status: inherited
    falsifier: A fresh session given a <=500-word bootstrap plus STATE.md answers keyed questions on fundamentals, envelope and decisions as well as one given the full prompt.
  retrieval:
    policy: CLAUDE.md (15.3k words) is always on; everything else is found by ad-hoc grep and three parallel explorers with bounded questions.
    impl: lead
    status: inherited
    falsifier: D1 - a kernel plus retrievable sections loses nothing on held-out probes.
  state:
    policy: 'The ledger is the state: append-only, hash-chained, one row per fact with target_kind, loop_version and attribution. STATE.md is rendered from it and holds nothing it lacks; the harness auto-memory keeps only a pointer.'
    impl: loop/ledger.py, loop/generation.py close
    status: inherited
    falsifier: A successor-fidelity check passes on rendered STATE.md + ledger and fails on prose alone.
    evidence:
    - L0003
  generate:
    policy: 'Candidates are enumerated, not recalled: every untested component falsifier, every claim''s missing experiment, every unvalidated rule annotation and every observation of this generation is a source; the lead merges and words the slate and records what it dropped.'
    impl: loop/choose.py candidates
    status: tested
    falsifier: A slate built by an explicit procedure contains a candidate the lead did not think of that later wins selection.
    evidence:
    - L0001
    - L0018
    - L0026
  reflect:
    policy: Every ledger row names the loop components responsible (attribution). generation.py reflect turns that into a per-component scorecard; the component under most evidence pressure and not yet adopted on evidence is where the next loop mutation is looked for first.
    impl: loop/generation.py reflect
    status: tested
    falsifier: Attribution in the ledger changes which component is mutated next at least once in three generations.
    evidence:
    - L0003
    - L0025
  topology:
    policy: Three read-only explorers with disjoint questions, then one adversarial planner reviewing the lead's design before approval. Lead synthesises.
    impl: lead
    status: inherited
    evidence:
    - L0002
    falsifier: A seeded-flaw replay shows lead self-review finds as many design confounds as the external reviewer.
  cascade:
    policy: L0 static, L1 archived replay, L2 provider-free, L3 planning-only live, L4 sealed goals. An instrument is verified on a disjoint fixture, never on the corpus it will evaluate. Every generation declares a Claude-usage budget before fan-out and charges subagents and headless sessions to it. Under a provider limit a slot with no billed tokens is never-attempted and one cut off mid-session is interrupted; both are set aside once, by criteria fixed before any score is read.
    impl: loop/census.py, loop/replay.py, loop/probe.py
    status: promoted
    evidence:
    - L0004
    - L0014
    - L0020
    - L0021
    - L0022
    falsifier: A generation that follows this policy still leaks an outcome to a forecaster or loses sessions to its own spend.
  evaluators:
    policy: Exact-match keys wherever the host can know the answer; blind rubric only for prose, reported apart and never a hard constraint; a floor arm must discriminate or the experiment is void.
    impl: loop/probe.py
    status: inherited
    falsifier: The floor test voids an experiment whose keyed scores would otherwise have been read as a result.
  explore:
    policy: None explicit; the lead pursued the largest visible debt.
    impl: lead
    status: inherited
    falsifier: Reserving a fixed share for the highest-uncertainty candidate yields a decision the greedy order would have missed.
  select:
    policy: Pareto front over a metrics vector; hub bypass = 0 and fabricated execution = 0 are lexicographic; no scalar score.
    impl: loop/choose.py
    status: inherited
    falsifier: A selection made with a scalar score agrees with the Pareto choice on every recorded decision.
  next:
    policy: 'A slate of at least five candidates over all three mutation kinds, each with hypotheses, a prior and an outcome model; exact expected information gain per cost, risk as a Pareto axis, the fundamentals as hard filters; the choice and its forecast are recorded before it runs. Which forecaster supplies the priors is still open: structured estimates lead intuition and a three-agent ensemble on 9 of 23 events, below the 15 the promotion rule requires.'
    impl: loop/choose.py slate, loop/generation.py select
    status: inherited
    evidence:
    - L0001
    - L0019
    - L0024
    falsifier: M1 - a structured or ensemble forecaster is not better calibrated than lead intuition on the frozen event set.
  successor:
    policy: Every generation scores its predecessor's forecasts, reflects, builds a slate across all three kinds, selects, executes inside the owner's envelope, promotes one kind per commit, renders STATE.md and verifies it with a fresh session.
    impl: README.md
    status: inherited
    falsifier: A fresh session given only the successor files proposes an opening move that contradicts a recorded decision.
