# Forecast event set E for generation 0 -- frozen before any forecast exists.
# Every event is binary and is resolved by script from D1 session records or
# from instruments run on corpora the lead had not replayed when this file
# was sealed. An event that cannot be resolved (experiment void, corpus
# unreadable) resolves to null and is dropped from every forecaster's score
# alike. Excluded on purpose: anything computed from the aggregate replay of
# experiments-public + qual_water_wbo_goal2 (seen by the lead, ledger L0004)
# and anything the lead controls (e.g. the kernel's own size).
#
# D1 definitions. Arms: A0 charter absent, A1 full charter always-on, A2
# kernel always-on + verbatim sections on disk. 18 keyed MCQ + 6 prose probes;
# default model, 3 replicates per arm. acc(arm) = mean over replicates of the
# keyed-MCQ fraction correct. spread = max over arms of (max - min) of the
# per-replicate accuracy.
events:
  E01: {source: d1, text: "Canary passes - a nonce in CLAUDE.md AND a nonce reachable only through an '@AGENTS.md' import are both echoed by a headless session."}
  E02: {source: d1, text: "Floor discriminates - acc(A1) - acc(A0) > spread (the experiment is not void)."}
  E03: {source: d1, text: "Kernel loses nothing - acc(A2) >= acc(A1) - spread."}
  E04: {source: d1, text: "Kernel is strictly better - acc(A2) > acc(A1)."}
  E05: {source: d1, text: "acc(A0) >= 0.60."}
  E06: {source: d1, text: "acc(A1) >= 0.85."}
  E07: {source: d1, text: "On the 6 'boundary' probes, acc(A2) >= acc(A1)."}
  E08: {source: d1, text: "On the 6 'invariant' probes, acc(A0) >= 0.80."}
  E09: {source: d1, text: "On keyed probes whose key is marked charter_only, acc(A0) <= 0.40."}
  E10: {source: d1, text: "Mean tool calls per session in A2 >= 1.5 x the mean in A1."}
  E11: {source: d1, text: "Mean wall-clock seconds per session in A2 > A1."}
  E12: {source: d1, text: "Smaller model (sonnet, 1 replicate) - keyed correct count in A2 >= count in A1 minus 1."}
  E13: {source: d1, text: "The contamination audit finds at least one attempted read outside the arm tree in any session."}
  E14: {source: d1, text: "Blind rubric on the 6 prose probes - mean score A2 >= mean score A1."}
  E15: {source: d1, text: "Mean billed input tokens per session (input + cache creation + cache read) in A2 < A1."}
  E16: {source: census, text: "Of the 26 stem rules, at least half have capability-ladder status 'tested'."}
  E17: {source: census, text: "Median word count of the 20 rules with empty provenance > median word count of the 49 rules with provenance."}
  E18: {source: census, text: "At least 10 of the 20 empty-provenance rules have placement 'stem'."}
  E19: {source: replay-experiments, text: "replay.py verifies the hash chain of every events.jsonl under experiments/ (untracked scratch, read-only)."}
  E20: {source: replay-experiments, text: "Across experiments/ streams, the share of refusals (tool_failed) whose tool later succeeds in-session is >= 0.80."}
  E21: {source: replay-experiments, text: "Across experiments/ streams, the share of refusals carrying a routed failure_report is >= 0.50."}
  E22: {source: replay-mirror, text: "replay.py runs without exception and verifies the chain on >= 90% of events.jsonl files under ~/developer/chemsmart-hetzner-mirror/campaign/."}
  E23: {source: replay-mirror, text: "Median first-turn input tokens across mirror streams that record them is < 40000."}
