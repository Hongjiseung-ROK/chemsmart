name: macOS packaging spike

on:
  workflow_dispatch:
    inputs:
      candidate:
        description: Candidate to run while iterating; final evidence uses both.
        required: true
        default: both
        type: choice
        options:
          - both
          - pyinstaller
          - pyside6-deploy

permissions:
  contents: read

jobs:
  package-probe:
    name: ${{ matrix.candidate }} / macOS 14 arm64
    runs-on: macos-14
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        candidate: ${{ fromJSON(inputs.candidate == 'both' && '["pyinstaller","pyside6-deploy"]' || format('["{0}"]', inputs.candidate)) }}
    env:
      CANDIDATE: ${{ matrix.candidate }}
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PYTHONUNBUFFERED: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Record builder identity
        run: |
          mkdir -p "build/p1/${CANDIDATE}"
          sw_vers > "build/p1/${CANDIDATE}/sw_vers.txt"
          uname -a > "build/p1/${CANDIDATE}/uname.txt"
          python -VV > "build/p1/${CANDIDATE}/python.txt"
          test "$(uname -m)" = "arm64"
          test "$(sw_vers -productVersion | cut -d. -f1)" = "14"

      - name: Install isolated candidate dependencies
        run: |
          python -m pip install \
            -c packaging/macos/constraints.txt \
            -r packaging/macos/build-requirements.txt \
            ".[gui,agent,agent-tui,test]"
          python -m pip freeze \
            > "build/p1/${CANDIDATE}/pip-freeze.txt"

      - name: Run source packaging contracts
        run: |
          python -m pytest -q \
            tests/gui \
            tests/test_config.py \
            tests/agent/test_cli_schema.py \
            tests/agent/test_provider_config.py \
            tests/agent/test_provider_adapter.py \
            tests/agent/tui/test_cli.py \
            tests/agent/tui/test_track_a_foundation.py \
            tests/agent/tui/test_synthesis_mode.py \
            tests/agent/test_synthesis.py

      - name: Build PyInstaller candidate
        if: matrix.candidate == 'pyinstaller'
        run: |
          python -m PyInstaller \
            --noconfirm \
            --clean \
            --distpath build/p1/pyinstaller/dist \
            --workpath build/p1/pyinstaller/work \
            packaging/macos/ChemSmart.pyinstaller.spec

      - name: Build pyside6-deploy candidate
        if: matrix.candidate == 'pyside6-deploy'
        run: |
          pyside6-deploy \
            -c packaging/macos/pysidedeploy.spec \
            --dry-run \
            --force \
            --keep-deployment-files \
            --verbose \
            2>&1 | tee build/p1/pyside6-deploy/dry-run.txt
          /usr/bin/grep -F -- '--include-package-data=chemsmart' \
            build/p1/pyside6-deploy/dry-run.txt
          /usr/bin/grep -F -- '--macos-signed-app-name=org.zhanglab.chemsmart' \
            build/p1/pyside6-deploy/dry-run.txt
          /usr/bin/grep -F -- '--macos-target-arch=arm64' \
            build/p1/pyside6-deploy/dry-run.txt
          pyside6-deploy \
            -c packaging/macos/pysidedeploy.spec \
            --force \
            --keep-deployment-files \
            --verbose

      - name: Locate and verify candidate bundle
        id: verify
        continue-on-error: true
        run: |
          app=$(find build chemsmart/gui/deployment \
            -type d -name 'ChemSmart.app' -print -quit 2>/dev/null)
          test -n "$app"
          python packaging/macos/verify_bundle.py \
            --app "$app" \
            --output "build/p1/${CANDIDATE}/metrics.json" \
            --archive "build/p1/${CANDIDATE}/ChemSmart-${CANDIDATE}.zip" \
            --forbidden-path "$GITHUB_WORKSPACE" \
            --forbidden-path "$RUNNER_TEMP" \
            --launches 3 || verify_status=$?
          if test -f "build/p1/${CANDIDATE}/ChemSmart-${CANDIDATE}.zip"; then
            shasum -a 256 \
              "build/p1/${CANDIDATE}/ChemSmart-${CANDIDATE}.zip" \
              > "build/p1/${CANDIDATE}/artifact.sha256"
          fi
          exit "${verify_status:-0}"

      - name: Upload candidate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chemsmart-p1-${{ matrix.candidate }}-macos14-arm64
          path: |
            build/p1/${{ matrix.candidate }}/sw_vers.txt
            build/p1/${{ matrix.candidate }}/uname.txt
            build/p1/${{ matrix.candidate }}/python.txt
            build/p1/${{ matrix.candidate }}/pip-freeze.txt
            build/p1/${{ matrix.candidate }}/dry-run.txt
            build/p1/${{ matrix.candidate }}/nuitka-report.xml
            build/p1/${{ matrix.candidate }}/metrics.json
            build/p1/${{ matrix.candidate }}/artifact.sha256
            build/p1/${{ matrix.candidate }}/launches-*/probe-*/receipt.json
            build/p1/${{ matrix.candidate }}/launches-*/probe-*/receipt.png
            build/p1/${{ matrix.candidate }}/launches-*/probe-*/application.*.txt
            build/p1/${{ matrix.candidate }}/launches-*/probe-*/workspace/*.xyz
            build/p1/${{ matrix.candidate }}/launches-*/probe-*/workspace/*.com
            build/p1/${{ matrix.candidate }}/launches-*/probe-*/workspace/*.inp
            build/p1/${{ matrix.candidate }}/launches-*/shell-*/receipt.json
            build/p1/${{ matrix.candidate }}/launches-*/shell-*/receipt.png
            build/p1/${{ matrix.candidate }}/launches-*/shell-*/application.*.txt
            build/p1/${{ matrix.candidate }}/work/ChemSmart/warn-ChemSmart.txt
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

      - name: Upload verified candidate bundle
        if: steps.verify.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: chemsmart-p1-${{ matrix.candidate }}-bundle-macos14-arm64
          path: |
            build/p1/${{ matrix.candidate }}/ChemSmart-*.zip
            build/p1/${{ matrix.candidate }}/artifact.sha256
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

      - name: Enforce candidate verifier result
        if: always() && steps.verify.outcome != 'success'
        run: exit 1
