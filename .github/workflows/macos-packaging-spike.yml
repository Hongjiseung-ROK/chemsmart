name: macOS PyInstaller packaging gate

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package-probe:
    name: PyInstaller / macOS 14 arm64
    runs-on: macos-14
    timeout-minutes: 120
    env:
      CANDIDATE: pyinstaller
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PYTHONUNBUFFERED: "1"

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11.9"
          cache: pip

      - name: Record builder identity
        run: |
          mkdir -p "build/p1/${CANDIDATE}"
          sw_vers > "build/p1/${CANDIDATE}/sw_vers.txt"
          uname -a > "build/p1/${CANDIDATE}/uname.txt"
          python -VV > "build/p1/${CANDIDATE}/python.txt"
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path("build/p1") / os.environ["CANDIDATE"]
          payload = {
              "commit": os.environ["GITHUB_SHA"],
              "repository": os.environ["GITHUB_REPOSITORY"],
              "run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "run_id": os.environ["GITHUB_RUN_ID"],
              "run_url": (
                  f"{os.environ['GITHUB_SERVER_URL']}/"
                  f"{os.environ['GITHUB_REPOSITORY']}/actions/runs/"
                  f"{os.environ['GITHUB_RUN_ID']}"
              ),
              "workflow_ref": os.environ["GITHUB_WORKFLOW_REF"],
              "workflow_sha": os.environ["GITHUB_WORKFLOW_SHA"],
          }
          (root / "source-provenance.json").write_text(
              json.dumps(payload, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY
          test "$(uname -m)" = "arm64"
          test "$(sw_vers -productVersion | cut -d. -f1)" = "14"

      - name: Install isolated candidate dependencies
        env:
          MPLCONFIGDIR: ${{ runner.temp }}/chemsmart-matplotlib-pyinstaller
        run: |
          python -m pip install --no-deps \
            "pip==25.3" \
            "setuptools==74.1.1" \
            "wheel==0.46.3"
          python -m pip install \
            --no-build-isolation \
            -c packaging/macos/constraints.txt \
            -c packaging/macos/runtime-lock-py311-macos14-arm64.txt \
            -r packaging/macos/build-requirements.txt \
            ".[gui,agent,agent-tui,test]"
          python -m pip check
          python -m pip freeze --all \
            > "build/p1/${CANDIDATE}/pip-freeze.txt"
          python packaging/macos/verify_runtime_lock.py \
            --lock packaging/macos/runtime-lock-py311-macos14-arm64.txt \
            --python-version 3.11.9 \
            --receipt "build/p1/${CANDIDATE}/runtime-lock-verification.json"
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          from matplotlib import font_manager

          cache_root = Path(os.environ["MPLCONFIGDIR"])
          font_path = Path(
              font_manager.findfont(
                  font_manager.FontProperties(family=["DejaVu Sans"])
              )
          )
          cache_files = sorted(
              str(path.relative_to(cache_root))
              for path in cache_root.rglob("*")
              if path.is_file()
          )
          if not font_path.is_file() or not cache_files:
              raise SystemExit("Matplotlib font-cache prewarm failed")
          payload = {
              "cache_files": cache_files,
              "font_path": str(font_path),
              "status": "passed",
          }
          receipt = Path("build/p1") / os.environ["CANDIDATE"] / "matplotlib-cache.json"
          receipt.write_text(
              json.dumps(payload, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Run source packaging contracts
        env:
          MPLCONFIGDIR: ${{ runner.temp }}/chemsmart-matplotlib-pyinstaller
        run: |
          set -o pipefail
          python -m pytest -q \
            tests/gui \
            tests/test_config.py \
            tests/agent/test_cli_schema.py \
            tests/agent/test_provider_config.py \
            tests/agent/test_provider_adapter.py \
            tests/agent/tui/test_cli.py \
            tests/agent/tui/test_track_a_foundation.py \
            tests/agent/tui/test_synthesis_mode.py \
            tests/agent/test_synthesis.py \
            tests/agent/test_secrets.py \
            2>&1 | tee "build/p1/${CANDIDATE}/source-tests.txt"

      - name: Build PyInstaller candidate
        run: |
          python -m PyInstaller \
            --noconfirm \
            --clean \
            --distpath build/p1/pyinstaller/dist \
            --workpath build/p1/pyinstaller/work \
            packaging/macos/ChemSmart.pyinstaller.spec

      - name: Apply nested-to-outer ad-hoc candidate signature
        id: signing
        continue-on-error: true
        run: |
          app=build/p1/pyinstaller/dist/ChemSmart.app
          test -d "$app"
          python packaging/macos/adhoc_sign_bundle.py \
            --app "$app" \
            --output "build/p1/${CANDIDATE}/adhoc-signing.json"

      - name: Locate and verify candidate bundle
        id: verify
        if: ${{ !cancelled() && steps.signing.outcome == 'success' }}
        continue-on-error: true
        run: |
          app=build/p1/pyinstaller/dist/ChemSmart.app
          test -d "$app"
          python packaging/macos/verify_bundle.py \
            --app "$app" \
            --output "build/p1/${CANDIDATE}/metrics.json" \
            --archive "build/p1/${CANDIDATE}/ChemSmart-${CANDIDATE}.zip" \
            --forbidden-path "$GITHUB_WORKSPACE" \
            --forbidden-path "$RUNNER_TEMP" \
            --launches 3 || verify_status=$?
          if test -f "build/p1/${CANDIDATE}/ChemSmart-${CANDIDATE}.zip"; then
            shasum -a 256 \
              "build/p1/${CANDIDATE}/ChemSmart-${CANDIDATE}.zip" \
              > "build/p1/${CANDIDATE}/artifact.sha256"
          fi
          exit "${verify_status:-0}"

      - name: Upload candidate evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: chemsmart-p1-pyinstaller-macos14-arm64
          path: |
            build/p1/pyinstaller/sw_vers.txt
            build/p1/pyinstaller/uname.txt
            build/p1/pyinstaller/python.txt
            build/p1/pyinstaller/pip-freeze.txt
            build/p1/pyinstaller/runtime-lock-verification.json
            build/p1/pyinstaller/matplotlib-cache.json
            build/p1/pyinstaller/source-provenance.json
            build/p1/pyinstaller/source-tests.txt
            build/p1/pyinstaller/adhoc-signing.json
            build/p1/pyinstaller/metrics.json
            build/p1/pyinstaller/artifact.sha256
            build/p1/pyinstaller/launches-*/probe-*/receipt.json
            build/p1/pyinstaller/launches-*/probe-*/receipt.png
            build/p1/pyinstaller/launches-*/probe-*/application.*.txt
            build/p1/pyinstaller/launches-*/probe-*/workspace/*.xyz
            build/p1/pyinstaller/launches-*/probe-*/workspace/*.com
            build/p1/pyinstaller/launches-*/probe-*/workspace/*.inp
            build/p1/pyinstaller/launches-*/shell-*/receipt.json
            build/p1/pyinstaller/launches-*/shell-*/receipt.png
            build/p1/pyinstaller/launches-*/shell-*/application.*.txt
            build/p1/pyinstaller/work/ChemSmart/warn-ChemSmart.txt
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

      - name: Upload verified candidate bundle
        if: steps.verify.outcome == 'success'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: chemsmart-p1-pyinstaller-bundle-macos14-arm64
          path: |
            build/p1/pyinstaller/ChemSmart-*.zip
            build/p1/pyinstaller/artifact.sha256
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

      - name: Enforce candidate verifier result
        if: always() && (steps.signing.outcome != 'success' || steps.verify.outcome != 'success')
        run: exit 1
