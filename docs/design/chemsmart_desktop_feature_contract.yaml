      - chemsmart/settings/submitters.py
      - chemsmart/agent/tools_hpc.py
    current_capability: local scheduler submission for the same run families
    desktop_v1: preserve_backend_block_ui
    preservation: CLI/TUI remain unchanged; desktop-safe registry excludes or denies submit_hpc
    gates:
      - submit_hpc_unavailable_in_gui
      - cli_sub_help_and_tests_green

  - id: unified_agent
    sources:
      - chemsmart/agent/core.py
      - chemsmart/agent/registry.py
      - chemsmart/agent/tui/mixins/session_workers.py
    current_capability: unified run_loop with synthesis, project_yaml, harness_jobs, execution, wizard, diagnostics groups
    desktop_v1: expose_safe_profile
    preservation: use run_loop, explicit PermissionPolicy, intent and semantic receipts
    gates:
