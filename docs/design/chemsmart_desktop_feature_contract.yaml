schema_version: 1
as_of: "2026-07-18"
baseline:
  branch: agent-codebase-simplification
  commit: 3f781642afc3
  upstream_ahead: 1
  upstream_behind: 6
  gui_state: p0_committed_p1_remote_candidate_pending

policies:
  - id: PRESERVE-CLI
    statement: Existing CLI commands and help/schema contracts remain supported.
  - id: PRESERVE-TUI
    statement: The Textual unified-agent TUI remains supported and regression-green.
  - id: SHARE-DOMAIN
    statement: GUI adapters call shared ChemSmart APIs and do not copy chemistry logic.
  - id: SAFE-DESKTOP
    statement: GUI v1 cannot run real local compute or submit HPC work.
  - id: NO-SILENT-DROP
    statement: CLI schema additions fail a GUI contract test until mapped explicitly.
  - id: ARTIFACT-PARITY
    statement: GUI fake-run artifacts match equivalent CLI fake-run artifacts.

surfaces:
  - id: configuration
    sources:
      - chemsmart/cli/config.py
      - chemsmart/agent/provider_config.py
    current_capability: CLI environment and provider configuration
    desktop_v1: expose
    preservation: shared pure config-tree API; no shell mutation; Keychain secret reference
    gates:
      - config_tree_without_shell_edit
      - provider_ping_before_persist
      - secret_not_in_yaml_logs_or_receipts
      - legacy_agent_yaml_migration

  - id: gaussian_run
    sources:
      - chemsmart/cli/gaussian
      - chemsmart/jobs/gaussian
    current_capability: 17 run job-kind leaves in the live CLI schema
    desktop_v1: expose_fake_only
    preservation: merge run/program/leaf schema; preserve Click placement and generated input
    gates:
      - all_gaussian_leaves_schema_mapped
      - high_risk_ts_scan_modred_td_dias_wbi_contracts
      - no_real_runner
      - gui_cli_artifact_parity

  - id: orca_run
    sources:
      - chemsmart/cli/orca
