      - high_risk_ts_scan_neb_aux_basis_contracts
      - no_real_runner
      - gui_cli_artifact_parity

  - id: xtb_run
    sources: []
    current_capability: absent from this checkout and its live CLI schema; candidate implementation exists in a separate checkout and requires a compatibility audit before porting
    desktop_v1: planned_missing_backend
    preservation: do not invent a GUI-only xTB runner; locate, review, and port the proven backend with CLI tests before adding the desktop surface
    lineage_candidates:
      - checkout: /Users/hongjiseung/bin/chemsmart
        branch: feat/xtb-submit-jobs
        commits:
          - 14f800a1
          - 1494fc18
        observed_modules:
          - chemsmart/cli/xtb
          - chemsmart/jobs/xtb
          - tests/test_xtb_cli.py
    gates:
