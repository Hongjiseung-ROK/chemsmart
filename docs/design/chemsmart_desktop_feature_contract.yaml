  sources:
    - chemsmart/agent/secrets.py
    - chemsmart/agent/provider_config.py
    - chemsmart/cli/config.py
    - chemsmart/gui/application/job_draft.py
    - chemsmart/gui/application/cli_launcher.py
    - chemsmart/gui/application/task_controller.py
    - chemsmart/gui/application/runtime_projection.py
    - chemsmart/gui/app.py
    - chemsmart/gui/frozen_dispatch.py
    - chemsmart/gui/screens/settings.py
    - packaging/macos/runtime-lock-py311-macos14-arm64.txt
    - packaging/macos/verify_runtime_lock.py
  current_capability: secure desktop application foundations implemented on the P1 phase boundary
  deferred_boundaries:
    - real_keychain_write_requires_explicit_user_action
    - job_builder_safe_preview_stays_disabled_until_p3_artifact_parity
    - live_agent_session_wiring_belongs_to_p4
    - workspace_choice_is_current_session_only_until_draft_persistence
    - optional_pymol_path_configuration_belongs_to_p5_p6
    - real_compute_and_hpc_are_unavailable
  gates:
    - key_reference_only_yaml_and_explicit_legacy_migration
    - atomic_config_merge_without_shell_mutation
    - typed_job_draft_all_26_gaussian_orca_leaves
    - database_record_structure_selector_semantics
    - explicit_checkout_or_frozen_cli_launcher
    - cancellation_timeout_retry_cleanup_and_stale_result_suppression
    - adaptive_native_shell_and_settings
    - canonical_runtime_state_projection_without_second_event_format
    - exact_python3119_macos14_arm64_build_runtime_lock

