    current_capability: opt, sp, and hess are selectively ported from the verified feature lineage; run fake/no-scratch, CLI submit test mode, live schema, and desktop artifact receipts are green
    desktop_v1: expose_fake_only
    preservation: the desktop uses the real CLI and fake runner; no GUI-only xTB chemistry or real-run action exists
    lineage_candidates:
      - checkout: /Users/hongjiseung/bin/chemsmart
        branch: feat/xtb-submit-jobs
        commits:
          - 14f800a1
          - 1494fc18
        observed_modules:
